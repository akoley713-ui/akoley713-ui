
name: Animated Contribution Board

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate animated heatmap
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-board.mjs

      - name: Publish SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
