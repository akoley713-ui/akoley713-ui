<svg width="900" height="190" viewBox="0 0 900 190"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .cell {
      animation: appear 0.35s ease-out forwards;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      transform: scale(0);
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .title {
      font-family: monospace;
      fill: #8b949e;
      font-size: 14px;
    }
  </style>

  <rect width="900" height="190" rx="12"
        fill="#0d1117"
        stroke="#30363d"/>

  <text x="25" y="30" class="title">
    CONTRIBUTION ACTIVITY
  </text>

  <!-- Activity cells -->

  <g transform="translate(25,50)">

    <!-- Row 1 -->
    <rect class="cell" x="0" y="0" width="12" height="12" rx="2"
          fill="#161b22" style="animation-delay:.05s"/>
    <rect class="cell" x="18" y="0" width="12" height="12" rx="2"
          fill="#0e4429" style="animation-delay:.10s"/>
    <rect class="cell" x="36" y="0" width="12" height="12" rx="2"
          fill="#006d32" style="animation-delay:.15s"/>
    <rect class="cell" x="54" y="0" width="12" height="12" rx="2"
          fill="#26a641" style="animation-delay:.20s"/>
    <rect class="cell" x="72" y="0" width="12" height="12" rx="2"
          fill="#39d353" style="animation-delay:.25s"/>

    <!-- Row 2 -->
    <rect class="cell" x="0" y="18" width="12" height="12" rx="2"
          fill="#0e4429" style="animation-delay:.30s"/>
    <rect class="cell" x="18" y="18" width="12" height="12" rx="2"
          fill="#161b22" style="animation-delay:.35s"/>
    <rect class="cell" x="36" y="18" width="12" height="12" rx="2"
          fill="#26a641" style="animation-delay:.40s"/>
    <rect class="cell" x="54" y="18" width="12" height="12" rx="2"
          fill="#0e4429" style="animation-delay:.45s"/>
    <rect class="cell" x="72" y="18" width="12" height="12" rx="2"
          fill="#39d353" style="animation-delay:.50s"/>

    <!-- Row 3 -->
    <rect class="cell" x="0" y="36" width="12" height="12" rx="2"
          fill="#006d32" style="animation-delay:.55s"/>
    <rect class="cell" x="18" y="36" width="12" height="12" rx="2"
          fill="#39d353" style="animation-delay:.60s"/>
    <rect class="cell" x="36" y="36" width="12" height="12" rx="2"
          fill="#161b22" style="animation-delay:.65s"/>
    <rect class="cell" x="54" y="36" width="12" height="12" rx="2"
          fill="#26a641" style="animation-delay:.70s"/>
    <rect class="cell" x="72" y="36" width="12" height="12" rx="2"
          fill="#0e4429" style="animation-delay:.75s"/>

    <!-- Row 4 -->
    <rect class="cell" x="0" y="54" width="12" height="12" rx="2"
          fill="#161b22" style="animation-delay:.80s"/>
    <rect class="cell" x="18" y="54" width="12" height="12" rx="2"
          fill="#006d32" style="animation-delay:.85s"/>
    <rect class="cell" x="36" y="54" width="12" height="12" rx="2"
          fill="#39d353" style="animation-delay:.90s"/>
    <rect class="cell" x="54" y="54" width="12" height="12" rx="2"
          fill="#26a641" style="animation-delay:.95s"/>
    <rect class="cell" x="72" y="54" width="12" height="12" rx="2"
          fill="#161b22" style="animation-delay:1s"/>

    <!-- Row 5 -->
    <rect class="cell" x="0" y="72" width="12" height="12" rx="2"
          fill="#0e4429" style="animation-delay:1.05s"/>
    <rect class="cell" x="18" y="72" width="12" height="12" rx="2"
          fill="#26a641" style="animation-delay:1.10s"/>
    <rect class="cell" x="36" y="72" width="12" height="12" rx="2"
          fill="#39d353" style="animation-delay:1.15s"/>
    <rect class="cell" x="54" y="72" width="12" height="12" rx="2"
          fill="#006d32" style="animation-delay:1.20s"/>
    <rect class="cell" x="72" y="72" width="12" height="12" rx="2"
          fill="#161b22" style="animation-delay:1.25s"/>

  </g>

  <!-- Animated progress line -->

  <rect x="130" y="55" width="700" height="3" rx="2"
        fill="#21262d"/>

  <rect x="130" y="55" width="0" height="3" rx="2"
        fill="#39d353">
    <animate
      attributeName="width"
      from="0"
      to="700"
      dur="2s"
      begin="0.3s"
      fill="freeze"/>
  </rect>

  <text x="130" y="85"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
    Building in public...
  </text>

  <text x="130" y="110"
        font-family="monospace"
        font-size="13"
        fill="#39d353">
    ● ACTIVE
  </text>

</svg>
